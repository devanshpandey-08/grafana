name: apply-131950-fix
on:
  push:
    branches: [fix/131950-grafana-source-header]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/131950-grafana-source-header
      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          replace(
              'pkg/services/query/query.go',
              '\tHeaderCallerID       = "X-Grafana-Caller-Id" // identifies the caller that initiated this query (e.g. an app plugin id or external tool name)\n',
              '\tHeaderCallerID       = "X-Grafana-Caller-Id" // identifies the caller that initiated this query (e.g. an app plugin id or external tool name)\n\tHeaderGrafanaSource   = "X-Grafana-Source" // identifies the Grafana feature that initiated the query\n',
          )

          replace(
              'packages/grafana-runtime/src/utils/DataSourceWithBackend.ts',
              "  PanelTitle = 'X-Panel-Title', // used by datasources to identify the panel title\n",
              "  PanelTitle = 'X-Panel-Title', // used by datasources to identify the panel title\n  GrafanaSource = 'X-Grafana-Source', // identifies the Grafana feature that initiated the query\n",
          )
          replace(
              'packages/grafana-runtime/src/utils/DataSourceWithBackend.ts',
              "    headers[PluginRequestHeaders.PluginID] = Array.from(pluginIDs).join(', ');\n    headers[PluginRequestHeaders.DatasourceUID] = Array.from(dsUIDs).join(', ');\n",
              "    headers[PluginRequestHeaders.PluginID] = Array.from(pluginIDs).join(', ');\n    headers[PluginRequestHeaders.DatasourceUID] = Array.from(dsUIDs).join(', ');\n\n    switch (request.app) {\n      case 'explore':\n        headers[PluginRequestHeaders.GrafanaSource] = 'explore';\n        break;\n      case 'dashboard':\n      case 'panel-editor':\n      case 'panel-viewer':\n        headers[PluginRequestHeaders.GrafanaSource] = 'dashboard';\n        break;\n      default:\n        headers[PluginRequestHeaders.GrafanaSource] = 'api';\n        break;\n    }\n",
          )

          replace(
              'pkg/registry/apis/query/header_utils.go',
              '\tstrings.ToLower(queryService.HeaderCallerID):       queryService.HeaderCallerID,\n',
              '\tstrings.ToLower(queryService.HeaderCallerID):       queryService.HeaderCallerID,\n\tstrings.ToLower(queryService.HeaderGrafanaSource):   queryService.HeaderGrafanaSource,\n',
          )

          p = Path('pkg/services/pluginsintegration/clientmiddleware/tracing_header_middleware.go')
          s = p.read_text()
          s = s.replace(
              '\t"github.com/grafana/grafana/pkg/services/contexthandler"\n\t"github.com/grafana/grafana/pkg/services/query"\n',
              '\t"github.com/grafana/grafana/pkg/services/contexthandler"\n\t"github.com/grafana/grafana/pkg/services/ngalert/models"\n\t"github.com/grafana/grafana/pkg/services/query"\n',
              1,
          )
          old = '''\tvar headersList = []string{\n\t\tquery.HeaderQueryGroupID,\n\t\tquery.HeaderPanelID,\n\t\tquery.HeaderDashboardUID,\n\t\tquery.HeaderDatasourceUID,\n\t\tquery.HeaderFromExpression,\n\t\t`X-Grafana-Org-Id`,\n\t\tquery.HeaderPanelPluginId,\n\t\tquery.HeaderDashboardTitle,\n\t\tquery.HeaderPanelTitle,\n\t\tquery.HeaderCallerID,\n\t}\n\n\tfor _, headerName := range headersList {\n'''
          new = '''\tsource := req.GetHTTPHeader(query.HeaderGrafanaSource)\n\tif reqCtx.Req != nil {\n\t\tif incoming := reqCtx.Req.Header.Get(query.HeaderGrafanaSource); incoming != "" {\n\t\t\tsource = incoming\n\t\t}\n\t}\n\tif req.GetHTTPHeader(models.FromAlertHeaderName) == "true" {\n\t\tsource = "alerting"\n\t}\n\tif source != "dashboard" && source != "explore" && source != "alerting" {\n\t\tsource = "api"\n\t}\n\treq.SetHTTPHeader(query.HeaderGrafanaSource, source)\n\n\tvar headersList = []string{\n\t\tquery.HeaderQueryGroupID,\n\t\tquery.HeaderPanelID,\n\t\tquery.HeaderDashboardUID,\n\t\tquery.HeaderDatasourceUID,\n\t\tquery.HeaderFromExpression,\n\t\t`X-Grafana-Org-Id`,\n\t\tquery.HeaderPanelPluginId,\n\t\tquery.HeaderDashboardTitle,\n\t\tquery.HeaderPanelTitle,\n\t\tquery.HeaderCallerID,\n\t}\n\n\tfor _, headerName := range headersList {\n'''
          if old not in s:
              raise SystemExit('tracing middleware anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('pkg/services/pluginsintegration/clientmiddleware/tracing_header_middleware_test.go')
          s = p.read_text()
          marker = '''\t\tt.Run("tracing headers are set for health check", func(t *testing.T) {\n'''
          test = '''\n\tt.Run("sets Grafana source to alerting for alerting requests", func(t *testing.T) {\n\t\treq, err := http.NewRequest(http.MethodGet, "/some/thing", nil)\n\t\trequire.NoError(t, err)\n\n\t\tcdt := clienttest.NewClientDecoratorTest(t,\n\t\t\tclienttest.WithReqContext(req, &user.SignedInUser{IsAnonymous: true, Login: "anonymous"}),\n\t\t\tclienttest.WithMiddlewares(NewTracingHeaderMiddleware()),\n\t\t)\n\n\t\t_, err = cdt.Decorator.QueryData(req.Context(), &backend.QueryDataRequest{\n\t\t\tHeaders: map[string]string{"FromAlert": "true"},\n\t\t})\n\t\trequire.NoError(t, err)\n\t\trequire.Equal(t, "alerting", cdt.QueryDataReq.GetHTTPHeader("X-Grafana-Source"))\n\t})\n\n'''
          if marker not in s:
              raise SystemExit('test insertion marker not found')
          p.write_text(s.replace(marker, test + marker, 1))

          Path('pkg/registry/apis/query/header_utils_test.go').write_text('''package query\n\nimport (\n\t"net/http"\n\t"testing"\n\n\t"github.com/stretchr/testify/require"\n)\n\nfunc TestExtractKnownHeadersGrafanaSource(t *testing.T) {\n\treq := http.Header{}\n\treq.Set("X-Grafana-Source", "explore")\n\n\tgot := ExtractKnownHeaders(req)\n\trequire.Equal(t, "explore", got["X-Grafana-Source"])\n}\n''')
          Path('.github/workflows/apply-131950-fix.yml').unlink()
      - name: Format and test focused packages
        run: |
          gofmt -w pkg/services/query/query.go pkg/services/pluginsintegration/clientmiddleware/tracing_header_middleware.go pkg/services/pluginsintegration/clientmiddleware/tracing_header_middleware_test.go pkg/registry/apis/query/header_utils.go pkg/registry/apis/query/header_utils_test.go
          yarn prettier --write packages/grafana-runtime/src/utils/DataSourceWithBackend.ts
          git diff --check
          go test ./pkg/services/pluginsintegration/clientmiddleware ./pkg/registry/apis/query
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pkg/services/query/query.go packages/grafana-runtime/src/utils/DataSourceWithBackend.ts pkg/registry/apis/query/header_utils.go pkg/registry/apis/query/header_utils_test.go pkg/services/pluginsintegration/clientmiddleware/tracing_header_middleware.go pkg/services/pluginsintegration/clientmiddleware/tracing_header_middleware_test.go .github/workflows/apply-131950-fix.yml
          git commit -m 'Add X-Grafana-Source to datasource requests'
          git push origin HEAD:fix/131950-grafana-source-header
