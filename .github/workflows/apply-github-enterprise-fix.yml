name: Apply GitHub Enterprise App fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changes = []

          p = Path('apps/provisioning/pkg/apis/provisioning/v0alpha1/connections.go')
          s = p.read_text()
          old = '''type GitHubConnectionConfig struct {\n\t// GitHub App ID\n\tAppID string `json:"appID"`\n\n\t// GitHub App installation ID\n\tInstallationID string `json:"installationID"`\n}'''
          new = '''type GitHubConnectionConfig struct {\n\t// GitHub App ID\n\tAppID string `json:"appID"`\n\n\t// GitHub App installation ID\n\tInstallationID string `json:"installationID"`\n\n\t// The GitHub Enterprise Server URL. Empty uses github.com.\n\tServerURL string `json:"serverUrl,omitempty"`\n}'''
          if old in s:
              p.write_text(s.replace(old, new, 1)); changes.append(str(p))

          p = Path('apps/provisioning/pkg/connection/github/connection.go')
          s = p.read_text()
          old = '''func (c config) CustomServerURL() string {\n\treturn ""\n}'''
          new = '''func (c config) CustomServerURL() string {\n\tif c.obj.Spec.GitHub == nil {\n\t\treturn ""\n\t}\n\treturn c.obj.Spec.GitHub.ServerURL\n}'''
          if old in s:
              p.write_text(s.replace(old, new, 1)); changes.append(str(p))

          p = Path('apps/provisioning/pkg/connection/github/mutator.go')
          s = p.read_text()
          if '"strings"' not in s:
              s = s.replace('''import (\n\t"context"\n\t"fmt"\n)''', '''import (\n\t"context"\n\t"fmt"\n\t"strings"\n)''', 1)
          old = '''\t// Set URL from GitHub installation\n\tconn.Spec.URL = fmt.Sprintf("https://github.com/settings/installations/%s", conn.Spec.GitHub.InstallationID)'''
          new = '''\t// Set URL from the configured GitHub installation host.\n\tserverURL := strings.TrimRight(conn.Spec.GitHub.ServerURL, "/")\n\tif serverURL == "" {\n\t\tserverURL = "https://github.com"\n\t}\n\tconn.Spec.URL = fmt.Sprintf("%s/settings/installations/%s", serverURL, conn.Spec.GitHub.InstallationID)'''
          if old in s:
              p.write_text(s.replace(old, new, 1)); changes.append(str(p))

          p = Path('apps/provisioning/kinds/connection.cue')
          s = p.read_text()
          old = '''\t\t\t\t\tinstallationID: int\n\t\t\t\t}'''
          new = '''\t\t\t\t\tinstallationID: int\n\n\t\t\t\t\t// The GitHub Enterprise Server URL. Empty uses github.com.\n\t\t\t\t\tserverUrl?: string\n\t\t\t\t}'''
          if old in s:
              p.write_text(s.replace(old, new, 1)); changes.append(str(p))

          p = Path('apps/provisioning/pkg/connection/github/mutator_test.go')
          s = p.read_text()
          if 'TestMutate_UsesConfiguredEnterpriseServerURL' not in s:
              marker = '\nfunc TestMutate_MultipleCallsIdempotent'
              test = '''\nfunc TestMutate_UsesConfiguredEnterpriseServerURL(t *testing.T) {\n\tconn := &provisioning.Connection{\n\t\tSpec: provisioning.ConnectionSpec{\n\t\t\tType: provisioning.GithubConnectionType,\n\t\t\tGitHub: &provisioning.GitHubConnectionConfig{\n\t\t\t\tInstallationID: "789012",\n\t\t\t\tServerURL:      "https://ghes.example.com/",\n\t\t\t},\n\t\t},\n\t}\n\n\trequire.NoError(t, github.Mutate(t.Context(), conn))\n\tassert.Equal(t, "https://ghes.example.com/settings/installations/789012", conn.Spec.URL)\n}\n'''
              if marker in s:
                  p.write_text(s.replace(marker, test + marker, 1)); changes.append(str(p))

          Path('apps/provisioning/pkg/connection/github/config_test.go').write_text('''package github\n\nimport (\n\t"testing"\n\n\tprovisioning "github.com/grafana/grafana/apps/provisioning/pkg/apis/provisioning/v0alpha1"\n\t"github.com/stretchr/testify/require"\n)\n\nfunc TestConfigCustomServerURL(t *testing.T) {\n\tconn := &provisioning.Connection{\n\t\tSpec: provisioning.ConnectionSpec{\n\t\t\tGitHub: &provisioning.GitHubConnectionConfig{\n\t\t\t\tServerURL: "https://ghes.example.com",\n\t\t\t},\n\t\t},\n\t}\n\n\trequire.Equal(t, "https://ghes.example.com", (config{obj: conn}).CustomServerURL())\n}\n''')
          changes.append('apps/provisioning/pkg/connection/github/config_test.go')

          if changes:
              print('\n'.join(changes))
          PY
          gofmt -w apps/provisioning/pkg/apis/provisioning/v0alpha1/connections.go apps/provisioning/pkg/connection/github/connection.go apps/provisioning/pkg/connection/github/mutator.go apps/provisioning/pkg/connection/github/mutator_test.go apps/provisioning/pkg/connection/github/config_test.go

      - name: Test
        run: go test ./apps/provisioning/pkg/connection/github

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/provisioning/pkg/apis/provisioning/v0alpha1/connections.go apps/provisioning/kinds/connection.cue apps/provisioning/pkg/connection/github/connection.go apps/provisioning/pkg/connection/github/mutator.go apps/provisioning/pkg/connection/github/mutator_test.go apps/provisioning/pkg/connection/github/config_test.go
          git commit -m "provisioning: support GitHub App connections on Enterprise"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
