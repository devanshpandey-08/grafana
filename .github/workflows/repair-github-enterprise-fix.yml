name: Repair GitHub Enterprise App fix

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Repair and test
        run: |
          set -euo pipefail
          sed -i '/^\s*"fmt"$/a\	"strings"' apps/provisioning/pkg/connection/github/mutator.go
          gofmt -w apps/provisioning/pkg/connection/github/mutator.go
          go test ./apps/provisioning/pkg/connection/github
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/provisioning/pkg/connection/github/mutator.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "provisioning: fix GitHub Enterprise connection import"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
