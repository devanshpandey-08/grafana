name: Apply GitHub Enterprise App fix

on:
  push:
    branches:
      - fix/github-app-enterprise-server-url

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor == 'devanshpandey-08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-app-enterprise-server-url
          fetch-depth: 0

      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          replace(
              "apps/provisioning/pkg/apis/provisioning/v0alpha1/connections.go",
              '''type GitHubConnectionConfig struct {\n\t// GitHub App ID\n\tAppID string `json:"appID"`\n\n\t// GitHub App installation ID\n\tInstallationID string `json:"installationID"`\n}''',
              '''type GitHubConnectionConfig struct {\n\t// GitHub App ID\n\tAppID string `json:"appID"`\n\n\t// GitHub App installation ID\n\tInstallationID string `json:"installationID"`\n\n\t// The GitHub Enterprise Server URL. Empty uses github.com.\n\tServerURL string `json:"serverUrl,omitempty"`\n}'''
          )

          replace(
              "apps/provisioning/pkg/connection/github/connection.go",
              '''func (c config) CustomServerURL() string {\n\treturn ""\n}''',
              '''func (c config) CustomServerURL() string {\n\tif c.obj.Spec.GitHub == nil {\n\t\treturn ""\n\t}\n\treturn c.obj.Spec.GitHub.ServerURL\n}'''
          )

          replace(
              "apps/provisioning/pkg/connection/github/mutator.go",
              '''import (\n\t"context"\n\t"fmt"\n''',
              '''import (\n\t"context"\n\t"fmt"\n\t"strings"\n'''
          )

          replace(
              "apps/provisioning/pkg/connection/github/mutator.go",
              '''\t// Set URL from GitHub installation\n\tconn.Spec.URL = fmt.Sprintf("https://github.com/settings/installations/%s", conn.Spec.GitHub.InstallationID)''',
              '''\t// Set URL from the configured GitHub installation host.\n\tserverURL := strings.TrimRight(conn.Spec.GitHub.ServerURL, "/")\n\tif serverURL == "" {\n\t\tserverURL = "https://github.com"\n\t}\n\tconn.Spec.URL = fmt.Sprintf("%s/settings/installations/%s", serverURL, conn.Spec.GitHub.InstallationID)'''
          )

          replace(
              "apps/provisioning/kinds/connection.cue",
              '''\t\t\t\t\tinstallationID: int\n\t\t\t\t}''',
              '''\t\t\t\t\tinstallationID: int\n\n\t\t\t\t\t// The GitHub Enterprise Server URL. Empty uses github.com.\n\t\t\t\t\tserverUrl?: string\n\t\t\t\t}'''
          )

          test_path = Path("apps/provisioning/pkg/connection/github/mutator_test.go")
          test = test_path.read_text()
          marker = "\nfunc TestMutate_MultipleCallsIdempotent"
          if "serverUrl" not in test:
              insertion = '''\nfunc TestMutate_UsesConfiguredEnterpriseServerURL(t *testing.T) {\n\tconn := &provisioning.Connection{\n\t\tSpec: provisioning.ConnectionSpec{\n\t\t\tType: provisioning.GithubConnectionType,\n\t\t\tGitHub: &provisioning.GitHubConnectionConfig{\n\t\t\t\tInstallationID: "789012",\n\t\t\t\tServerURL:      "https://ghes.example.com/",\n\t\t\t},\n\t\t},\n\t}\n\n\trequire.NoError(t, github.Mutate(t.Context(), conn))\n\tassert.Equal(t, "https://ghes.example.com/settings/installations/789012", conn.Spec.URL)\n}\n\n'''
              test = test.replace(marker, insertion + marker, 1)
              test_path.write_text(test)

          Path("apps/provisioning/pkg/connection/github/config_test.go").write_text('''package github\n\nimport (\n\t"testing"\n\n\tprovisioning "github.com/grafana/grafana/apps/provisioning/pkg/apis/provisioning/v0alpha1"\n\t"github.com/stretchr/testify/require"\n)\n\nfunc TestConfigCustomServerURL(t *testing.T) {\n\tconn := &provisioning.Connection{\n\t\tSpec: provisioning.ConnectionSpec{\n\t\t\tGitHub: &provisioning.GitHubConnectionConfig{\n\t\t\t\tServerURL: "https://ghes.example.com",\n\t\t\t},\n\t\t},\n\t}\n\n\trequire.Equal(t, "https://ghes.example.com", (config{obj: conn}).CustomServerURL())\n}\n''')

      - name: Format and test
        run: |
          gofmt -w apps/provisioning/pkg/apis/provisioning/v0alpha1/connections.go apps/provisioning/pkg/connection/github/connection.go apps/provisioning/pkg/connection/github/mutator.go apps/provisioning/pkg/connection/github/mutator_test.go apps/provisioning/pkg/connection/github/config_test.go
          go test ./apps/provisioning/pkg/connection/github

      - name: Commit fix
        run: |
          git config user.name "devanshpandey-08"
          git config user.email "231b094@juetguna.in"
          rm .github/workflows/fix-github-enterprise-app.yml
          git add apps/provisioning/pkg/apis/provisioning/v0alpha1/connections.go apps/provisioning/kinds/connection.cue apps/provisioning/pkg/connection/github/connection.go apps/provisioning/pkg/connection/github/mutator.go apps/provisioning/pkg/connection/github/mutator_test.go apps/provisioning/pkg/connection/github/config_test.go .github/workflows/fix-github-enterprise-app.yml
          git commit -m "provisioning: support GitHub App connections on Enterprise"
          git push origin fix/github-app-enterprise-server-url
